<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Tutorías | Consultar tutores</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container py-4 py-lg-5">
      <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
          <h1 class="h3 fw-bold mb-1">Consultar listado de tutores</h1>
          <p class="text-secondary mb-0">Selecciona una carrera para ver profesores tutores y sus tutorados asignados.</p>
        </div>
        <a class="btn btn-outline-primary" href="index.html">← Volver al panel</a>
      </header>

      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <label class="form-label fw-semibold" for="filtroCarreraTutor">Carrera</label>
          <select id="filtroCarreraTutor" class="form-select">
            <option value="">Selecciona una carrera</option>
            <option value="Ing. en Computación">Ing. en Computación</option>
            <option value="Ing. en Mecatrónica">Ing. en Mecatrónica</option>
          </select>
        </div>
      </section>

      <section class="card border-0 shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Profesores tutores</h2>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Tutor</th>
                  <th scope="col">Total de tutorados</th>
                  <th scope="col">Tutorados asignados</th>
                </tr>
              </thead>
              <tbody id="tablaTutores"></tbody>
            </table>
          </div>
          <p class="text-secondary small mt-3 mb-0" id="resumenTutores"></p>
        </div>
      </section>
    </div>

    <div class="modal fade" id="modalTutorados" tabindex="-1" aria-labelledby="modalTutoradosLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title fs-5" id="modalTutoradosLabel">Tutorados asignados</h3>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <p class="mb-3 fw-semibold" id="nombreTutorModal"></p>
            <div class="table-responsive">
              <table class="table table-sm table-striped align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Matrícula</th>
                    <th scope="col">Nombre completo</th>
                    <th scope="col">Carrera</th>
                    <th scope="col">Semestre</th>
                  </tr>
                </thead>
                <tbody id="tablaTutoradosModal"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="tutores.js"></script>
  </body>
</html>
