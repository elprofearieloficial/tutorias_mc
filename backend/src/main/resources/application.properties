spring.application.name=tutoriasmc-backend
server.port=8080

# Configuración de MySQL (ajusta según tu entorno)
spring.datasource.url=jdbc:mysql://localhost:3306/tutorias_mc?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL base para consulta de profesores.
# Si tu esquema usa otros nombres de tabla/campos, modifica esta consulta,
# manteniendo los alias: id, nombre_completo, grado_academico, carrera
app.sql.profesores=SELECT id, nombre_completo, grado_academico, carrera FROM profesores

# SQL base para consulta de tutorados con tutor.
# Ajusta tabla/campos según tu modelo, conservando alias:
# matricula, nombre_completo, carrera, semestre, tutor
app.sql.tutorados-con-tutor=SELECT e.matricula, e.nombre_completo, e.carrera, e.semestre, COALESCE(p.nombre_completo, '') AS tutor FROM estudiantes e LEFT JOIN profesores p ON e.tutor_id = p.id

# Orígenes permitidos para frontend local (separados por coma)
app.cors.allowed-origins=http://localhost:4173,http://127.0.0.1:4173
