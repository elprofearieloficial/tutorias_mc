<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Tutorías | Consultar estudiantes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container py-4 py-lg-5">
      <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
          <h1 class="h3 fw-bold mb-1">Consultar estudiantes</h1>
          <p class="text-secondary mb-0">Filtra por carrera y semestre para consultar la información de tutorías.</p>
        </div>
        <a class="btn btn-outline-primary" href="index.html">← Volver al panel</a>
      </header>

      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold" for="filtroCarrera">Carrera</label>
              <select id="filtroCarrera" class="form-select">
                <option value="">Selecciona una carrera</option>
                <option value="Ing. en Computación">Ing. en Computación</option>
                <option value="Ing. en Mecatrónica">Ing. en Mecatrónica</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label fw-semibold" for="filtroSemestre">Semestre</label>
              <select id="filtroSemestre" class="form-select" disabled>
                <option value="">Todos los semestres</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <section class="card border-0 shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Listado de alumnos</h2>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Matrícula</th>
                  <th scope="col">Nombre completo</th>
                  <th scope="col">Semestre</th>
                  <th scope="col">Tutor asignado</th>
                </tr>
              </thead>
              <tbody id="tablaEstudiantes"></tbody>
            </table>
          </div>
          <p class="text-secondary small mt-3 mb-0" id="resumenRegistros"></p>
        </div>
      </section>
    </div>

    <script src="estudiantes.js"></script>
  </body>
</html>
